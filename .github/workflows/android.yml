name: Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*-release.apk dist/smart-gif.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-gif
          path: dist/smart-gif.apk
          if-no-files-found: error
